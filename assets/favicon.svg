    }
  </style>
  <rect width="32" height="32" rx="6"/>
  <text x="16" y="21.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700">PK</text>
</svg>
